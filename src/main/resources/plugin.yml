name: SHEasterBunny
version: '${project.version}'
main: org.Cry_Legende.sHEasterBunny.SHEasterBunny
api-version: '1.20'
author: Cry_Legende
description: Événement de Pâques, des lapins à attraper dans une zone avec une limite par jour.
depend: [PlaceholderAPI]

commands:
  sheasterbunny:
    description: Administration de SHEasterBunny.
    usage: /sheasterbunny <reload|info>
    permission: sheasterbunny.admin.reload;sheasterbunny.admin.info

permissions:
  sheasterbunny.admin:
    description: Toutes les commandes d'administration de SHEasterBunny.
    default: op
    children:
      sheasterbunny.admin.reload: true
      sheasterbunny.admin.info: true
  sheasterbunny.admin.reload:
    description: /sheasterbunny reload
    default: op
  sheasterbunny.admin.info:
    description: /sheasterbunny info <joueur>
    default: op
