# SHEasterBunny
#
# Événement de Pâques : des lapins apparaissent dans la zone spawn-zone du monde indiqué et s'attrapent d'un clic
# droit. Chaque lapin attrapé lance les commandes de commands (golden-rabbit.commands pour un lapin doré) et compte
# pour le joueur ; daily-limit plafonne les récompenses par joueur et par jour.
#
# Commandes :
#   /sheasterbunny reload          Relit config.yml et messages.yml (zone, intervalle, limite, récompenses, textes).
#                                  Si un fichier est invalide, l'ancienne configuration reste active. data.yml n'est pas touché.
#   /sheasterbunny info <joueur>   Lapins attrapés au total et aujourd'hui, limite et reste du jour.
#
# Permissions :
#   sheasterbunny.admin           Toutes les commandes ci-dessous (op par défaut).
#   sheasterbunny.admin.reload    /sheasterbunny reload (op par défaut).
#   sheasterbunny.admin.info      /sheasterbunny info (op par défaut).
#
# Placeholders (PlaceholderAPI) :
#   %sheasterbunny_rabbits%   Nombre de lapins attrapés par le joueur.
#
# Les messages sont dans messages.yml.
#
# Plusieurs serveurs de jeu : les lapins ne s'attrapent que dans le monde Easter, hébergé par un seul Opale. Ne poser
# le plugin que sur celui-là : data.yml (totaux et compteur du jour) n'a ainsi qu'un seul serveur qui l'écrit, et la
# limite du jour ne se contourne pas en changeant d'Opale. Rien à synchroniser, SHNetwork n'est pas utilisé.

# Configuration de la zone de spawn
spawn-zone:
  world: Easter
  min-x: 13
  max-x: -11
  min-y: 75
  max-y: 80
  min-z: -199
  max-z: -180

# Nombre maximum de lapins simultanés
max-rabbits: 30

# Intervalle de spawn (en ticks, 20 ticks = 1 seconde)
spawn-interval-ticks: 250

daily-limit:
  enabled: true
  max-per-day: 350
  message-cooldown-seconds: 60 # secondes

custom-name: "&7Attrape-moi !"

# Commande à exécuter lors du clic sur un lapin (s’exécute depuis la console)
commands: 
  - "points give %player% 1"
  - "tournament custom LAPIN %player%"

# Son à jouer lors du clic sur un lapin (nom de l’énumération Sound)
click-sound: ENTITY_FIREWORK_ROCKET_BLAST

# Son à jouer lors de l’apparition d’un lapin
spawn-sound: ENTITY_ITEM_PICKUP

# Particule à afficher lors de la disparition du lapin (nom de l’énumération Particle)
particle: CLOUD

golden-rabbit:
  chance: 0.05
  custom-name: "&eAttrape-moi !"
  commands:
    - "points give %player% 10"
    - "tournament custom LAPIN %player%"
